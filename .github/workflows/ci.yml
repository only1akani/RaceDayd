#this workflow runs on every push
#job 1 builds the part 2 api and runs all the unit tests
#job 2 builds the part 3 mvc website, builds its docker image and checks the container starts
name: Build and Test (API and MVC)

on:
  push:
  pull_request:

jobs:
  api:
    name: Part 2 - build API and run unit tests
    runs-on: ubuntu-latest

    steps:
      #start of steps
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore Part2/RaceDay.sln

      - name: Build
        run: dotnet build Part2/RaceDay.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test Part2/RaceDay.sln --no-build -c Release --logger "console;verbosity=normal"
      #end of steps

  web:
    name: Part 3 - build MVC app and Docker image
    runs-on: ubuntu-latest

    steps:
      #start of steps
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore Part3/RaceDay.Web.sln

      - name: Build the MVC project
        run: dotnet build Part3/RaceDay.Web.sln --no-restore -c Release

      - name: Build the Docker image
        run: docker build -t raceday-web Part3/RaceDay.Web

      - name: Check the container starts
        run: |
          docker run -d --name raceday-web -p 8080:8080 raceday-web
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/Account/Login > /dev/null; then
              echo "The website is running in the container"
              exit 0
            fi
            sleep 2
          done
          docker logs raceday-web
          exit 1
      #end of steps