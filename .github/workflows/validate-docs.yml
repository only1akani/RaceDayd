#this workflow checks that the /docs folder has everything part 1 needs
#it runs every time i push, so i know straight away if a file is missing
name: Validate Repo Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs-folder:
    runs-on: ubuntu-latest

    steps:
      #start of steps
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check ERD image is in /docs
        run: |
          if ! ls docs/*ERD* 1> /dev/null 2>&1; then
            echo "no ERD file found in docs (expected a file with ERD in the name)"
            exit 1
          fi
          echo "ERD file found"

      - name: Check API endpoint plan is in /docs
        run: |
          if ! ls docs/*Endpoint* 1> /dev/null 2>&1; then
            echo "no API endpoint plan file found in docs"
            exit 1
          fi
          echo "API endpoint plan found"

      - name: Check SQL script is in /docs
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "no .sql file found in docs"
            exit 1
          fi
          echo "SQL script found"

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "README.md is missing from the repo root"
            exit 1
          fi
          echo "README found"
      #end of steps
